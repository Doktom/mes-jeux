<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Pêche Perchée</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- HUD haut gauche -->
  <div id="hud-left">
    <div id="hud-top">
      <div class="pill" id="money">🪙 0</div>
      <div class="pill" id="bucket-count">🪣 0/6</div>
      <div class="pill spot" id="spot-name">—</div>
      <div class="pill spot" id="clock">—</div>
      <div class="pill lvl" id="lvl" title="Niveaux"></div>
      <div class="pill trip hidden" id="trip"></div>
    </div>
    <div id="quest-tracker"></div>
    <div id="buffs"></div>
    <div id="toasts"></div>
  </div>

  <!-- Boutons PNJ -->
  <div id="hud-buttons">
    <button class="btn" data-open="josiane" title="Vendre ses prises">🐟 La Josiane</button>
    <button class="btn" data-open="jm" title="Matériel de pêche">🛒 Jean-Michmich</button>
    <button class="btn" data-open="coco" title="Cosmétiques">🎀 Coco</button>
    <button class="btn" data-open="marche" title="Ingrédients, matériel de cuisine, recettes">🧺 Marché</button>
    <button class="btn" data-open="cuisine" title="Cuisiner du poisson">🍳 Cuisine</button>
    <button class="btn" data-open="ferme" title="Cultiver des ingrédients">🌱 Potager</button>
    <button class="btn" data-open="gerard" title="Prophétie, commandes, défis, concours">👴 Tonton</button>
    <button class="btn" data-open="map">🗺️ Carte</button>
    <button class="btn" data-open="carnet">📖 Carnet</button>
    <button class="btn shady hidden" id="btn-merchant" data-open="merchant">🕶️ Marchand Louche !</button>
    <button class="btn icon" id="btn-music" title="Musique">🎵</button>
    <button class="btn icon" data-open="menu" title="Menu (Échap)">☰</button>
  </div>

  <div id="contest" class="hidden"></div>

  <!-- Équipement -->
  <div id="gear">
    <div class="gear-line" id="gear-rod">🎣 —</div>
    <button class="gear-line gear-btn" id="gear-depth" title="Changer de profondeur">🌊 Surface</button>
    <button class="gear-line gear-btn" id="gear-bait" title="Changer d'appât">🪱 —</button>
    <button class="gear-line gear-btn hidden" id="gear-boat" title="Changer de zone de pêche">⚓ Zone</button>
  </div>

  <!-- Narrateur -->
  <div id="narrator" class="hidden"><span class="who" id="narrator-who">Narrateur</span><span id="narrator-text"></span></div>

  <div id="cam-help">🖱️ Clic droit + glisser : tourner · Maj + clic droit : déplacer · Molette : zoom · R : recentrer</div>
  <div id="hint"></div>
  <div id="power" class="hidden"><div id="power-fill"></div><span>PUISSANCE</span></div>

  <!-- Moulinage -->
  <div id="reel" class="hidden">
    <div id="reel-warn"></div>
    <div id="reel-beh"></div>
    <div class="reel-label">Tension</div>
    <div id="reel-track"><div id="reel-zone"></div><div id="reel-needle"></div></div>
    <div class="reel-label">Remontée</div>
    <div id="reel-prog"><div id="reel-prog-fill"></div></div>
  </div>

  <div id="bang" class="hidden">!</div>

  <!-- Carte de prise -->
  <div id="catch" class="hidden">
    <div class="catch-rarity" id="catch-rarity"></div>
    <div class="catch-name" id="catch-name"></div>
    <div class="catch-stats"><span id="catch-weight"></span><span id="catch-price"></span></div>
    <div class="catch-desc" id="catch-desc"></div>
    <div class="catch-badges" id="catch-badges"></div>
    <div class="stolen-msg">🐦 Volé par Gégé la Mouette !</div>
    <button class="btn eat hidden" id="catch-eat">🌈 Le manger tout de suite</button>
    <button class="btn big" id="catch-ok">Dans le seau !</button>
  </div>

  <!-- Panneau modal -->
  <div id="panel-wrap" class="hidden">
    <div id="panel">
      <div id="panel-head">
        <h2 id="panel-title"></h2>
        <button class="btn close" id="panel-close">✕</button>
      </div>
      <div id="panel-quote"></div>
      <div id="panel-tabs"></div>
      <div id="panel-body"></div>
    </div>
  </div>

  <input type="file" id="import-file" accept=".json,application/json" class="hidden">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/data2.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/models.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
