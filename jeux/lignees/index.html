<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lignées</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css">
  <!-- Thème graphique : celui du dernier choix (Paramètres), sans clignotement au chargement. -->
  <script>
    (function () {
      var t = 'manuscrit';
      try { t = localStorage.getItem('lignees_theme') || t; } catch (e) { }
      if (t !== 'manuscrit' && t !== 'vapeur') t = 'manuscrit';
      document.documentElement.dataset.theme = t;
      document.write('<link id="theme-css" rel="stylesheet" href="css/themes/' + t + '.css">');
    })();
  </script>
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <aside id="left">
      <div id="resources"></div>
      <div id="hint" class="hint"></div>
    </aside>
    <main id="center">
      <canvas id="map"></canvas>
      <div id="toasts"></div>
    </main>
    <aside id="right">
      <nav id="tabs"></nav>
      <div id="panel"></div>
      <div id="selection" class="hidden"></div>
    </aside>
  </div>
  <div id="modal-root"></div>
  <div id="tooltip"></div>

  <!-- Scripts classiques (sans module) : le jeu fonctionne aussi en ouvrant index.html directement. -->
  <script src="js/core/util.js"></script>
  <script src="js/data/resources.js"></script>
  <script src="js/data/terrain.js"></script>
  <script src="js/data/buildings.js"></script>
  <script src="js/data/progression.js"></script>
  <script src="js/data/lore.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/data/achievements.js"></script>
  <script src="js/data/story.js"></script>
  <script src="js/ui/theme.js"></script>
  <script src="js/core/map.js"></script>
  <script src="js/core/mods.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/economy.js"></script>
  <script src="js/core/logistics.js"></script>
  <script src="js/core/power.js"></script>
  <script src="js/core/defense.js"></script>
  <script src="js/core/logic.js"></script>
  <script src="js/core/chronicle.js"></script>
  <script src="js/core/bot.js"></script>
  <script src="js/ui/render.js"></script>
  <script src="js/ui/cinematic.js"></script>
  <script src="js/ui/lore.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
