<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Irie Bay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Jeu plein écran : la scène 3D occupe tout ; l'interface flotte en panneaux "affiche de sound system"
   (contour encré, ombre dure, bande rouge-or-vert en haut). Un seul look, assumé. */
:root{
  --ink:#241a2e; --paper:#fff3cf; --paper-2:#f7de9a; --red:#e2362f; --gold:#f6c026; --green:#2fa84f; --sea:#17a9c7; --coral:#ff6b57; --night:#14183a; --berry:#c8286b;
  --stripe:linear-gradient(90deg,var(--red) 0 33.4%,var(--gold) 33.4% 66.7%,var(--green) 66.7%);
  --f-display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gl:max(16px, env(safe-area-inset-left,0px)); --gr:max(16px, env(safe-area-inset-right,0px));
  --gt:max(16px, env(safe-area-inset-top,0px)); --gb:max(16px, env(safe-area-inset-bottom,0px));
  --slot:min(54px, calc((100vw - 72px) / 10));
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.panel{background:var(--stripe) top/100% 5px no-repeat,var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.panel.plain{background:var(--paper)}
button{font:inherit;color:inherit}
.btn{font-family:var(--f-display);font-weight:400;font-size:16px;line-height:1;border:2px solid var(--ink);border-radius:10px;background:var(--paper-2);box-shadow:2px 2px 0 var(--ink);padding:9px 14px 7px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#fff}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--gold)}
.btn.green{background:#7fdc8b}
.btn.sm{font-size:14px;padding:7px 10px 5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible,.slot:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
kbd{font-family:var(--f-body);font-weight:700;font-size:.85em;border:1.5px solid var(--ink);border-bottom-width:3px;border-radius:5px;padding:0 5px;background:#fff}
.coin{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18);flex:none}
.heart{width:14px;height:13px;display:inline-block;vertical-align:-2px}

#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#clock{position:absolute;top:var(--gt);right:var(--gr);padding:11px 14px 9px;min-width:136px;display:grid;gap:2px;text-align:right}
.cl-top{font-family:var(--f-display);font-size:19px;display:flex;justify-content:flex-end;gap:6px;align-items:center}
#cl-wx{width:26px;height:26px;display:block}
#cl-season{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;font-weight:700}
.cl-time{font-family:var(--f-display);font-size:30px;line-height:1.05;display:flex;justify-content:flex-end;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
#cl-sun{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--gold);transition:background .6s}
.cl-gold{margin-top:4px;padding-top:6px;border-top:2px dashed rgba(36,26,46,.25);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;display:flex;justify-content:flex-end;align-items:center;gap:6px}
#energy{position:absolute;right:var(--gr);bottom:var(--gb);width:28px;height:150px;padding:4px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}
#en-fill{width:100%;border-radius:6px;background:var(--green);border:2px solid var(--ink);box-sizing:border-box;transition:height .25s,background .25s;min-height:4px}
#energy b{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--paper);text-shadow:2px 2px 0 var(--ink)}
#hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--gb);display:flex;gap:4px;padding:9px 5px 5px;pointer-events:auto}
.slot{width:var(--slot);height:var(--slot);border-radius:8px;background:var(--paper-2);border:2px solid transparent;position:relative;display:grid;place-items:center;cursor:pointer;padding:0}
.slot.sel{border-color:var(--ink);background:#fff;box-shadow:inset 0 -4px 0 var(--gold)}
.slot img{width:80%;height:80%;pointer-events:none}
.slot .q{position:absolute;right:3px;bottom:0;font-weight:700;font-size:12px;text-shadow:-1px -1px 0 #fff,1px 1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff;font-variant-numeric:tabular-nums}
.slot .k{position:absolute;left:4px;top:1px;font-size:10px;font-weight:700;opacity:.45}
.slot .gauge{position:absolute;left:7px;right:7px;bottom:4px;height:4px;background:rgba(36,26,46,.18);border-radius:2px;overflow:hidden}
.slot .gauge i{display:block;height:100%;background:var(--sea)}
#itemname{position:absolute;left:50%;bottom:calc(var(--gb) + var(--slot) + 24px);transform:translateX(-50%);font-family:var(--f-display);font-size:17px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);white-space:nowrap;transition:opacity .3s;opacity:0}
#prompt{position:absolute;left:50%;bottom:calc(var(--gb) + var(--slot) + 54px);transform:translateX(-50%);padding:9px 12px 5px;font-weight:700;font-size:15px;white-space:nowrap;display:none}
#prompt.on{display:block}
#toasts{position:absolute;left:var(--gl);top:calc(var(--gt) + 50px);display:grid;gap:6px;justify-items:start;max-width:min(360px, calc(100vw - 200px))}
.toast{padding:10px 12px 6px;font-size:14px;font-weight:700;animation:tin .25s ease-out}
.toast.good{background:var(--stripe) top/100% 5px no-repeat,#e9ffd6}
.toast.out{opacity:0;transform:translateX(-10px);transition:all .35s}
@keyframes tin{from{opacity:0;transform:translateX(-12px)}}
#top-left{position:absolute;left:var(--gl);top:var(--gt);display:flex;gap:8px;pointer-events:auto}
.chip{height:38px;min-width:38px;padding:0 10px;box-sizing:border-box;border-radius:19px;font-family:var(--f-display);font-size:17px;cursor:pointer;display:grid;place-items:center}
#tracker{position:absolute;left:var(--gl);bottom:calc(var(--gb) + 6px);max-width:min(300px, 34vw);padding:10px 12px 8px;font-size:13px;line-height:1.35;display:none}
#tracker.on{display:block}
#tracker b{display:block;font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--berry)}
#tracker .tbar{height:7px;border-radius:4px;background:rgba(36,26,46,.15);margin-top:5px;overflow:hidden;border:1.5px solid var(--ink)}
#tracker .tbar i{display:block;height:100%;background:var(--green)}
#zone{position:absolute;left:50%;top:calc(var(--gt) + 6px);transform:translateX(-50%);font-family:var(--f-display);font-size:clamp(24px,4.2vw,36px);color:var(--paper);text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1px var(--ink);opacity:0;transition:opacity .6s;white-space:nowrap;letter-spacing:.01em}
#zone.on{opacity:1}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.bubble{position:absolute;transform:translate(-50%,-100%);padding:10px 11px 6px;font-size:14px;font-weight:700;max-width:220px;text-align:center;line-height:1.3}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.bang{font-family:var(--f-display);font-size:30px;padding:8px 12px 0;color:var(--red);animation:pop .3s}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.4)}}
.floater{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-display);font-size:18px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);animation:rise 1.3s ease-out forwards;white-space:nowrap;display:flex;align-items:center;gap:4px}
.floater img{width:28px;height:28px}
@keyframes rise{to{transform:translate(-50%,-190%);opacity:0}}

#fishing{position:fixed;z-index:4;left:calc(50% + 70px);top:50%;transform:translateY(-50%);padding:14px 10px 8px;display:grid;justify-items:center;gap:4px}
#fishing p{margin:0;font-size:12px;font-weight:700;text-align:center}
#fish-c{width:110px;height:330px;display:block}

#modal-wrap{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(20,24,58,.45);padding-left:var(--gl);padding-right:var(--gr)}
#modal{width:min(580px, 100%);max-height:calc(100% - 48px);overflow:auto;padding:20px 20px 16px;box-sizing:border-box}
#modal h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
#modal .who{margin:6px 0 0;font-size:15px;line-height:1.45;max-width:62ch}
#modal .who b{color:var(--berry)}
.tabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.tab{font-family:var(--f-display);font-size:16px;border:2px solid var(--ink);border-radius:9px;padding:7px 14px 5px;background:var(--paper-2);cursor:pointer}
.tab[aria-selected="true"]{background:#fff;box-shadow:inset 0 -4px 0 var(--gold)}
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;background:rgba(247,222,154,.55)}
.row.on{background:rgba(127,220,139,.45)}
.row img{width:40px;height:40px}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:15px}
.row .nm small{display:block;font-size:12.5px;opacity:.75;line-height:1.3}
.row .price{font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;white-space:nowrap}
.row .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:18px 8px;text-align:center;opacity:.7;font-size:14px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.mfoot .money{font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:14px 0 4px;font-size:14.5px;align-items:center}
.keys dt{white-space:nowrap}
.keys dd{margin:0}
.daylines{margin:12px 0 4px;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.daylines li{display:flex;gap:8px;align-items:center}
.hearts{display:inline-flex;gap:2px;vertical-align:middle}
.bar{height:10px;border-radius:5px;background:rgba(36,26,46,.15);border:1.5px solid var(--ink);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--green)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:4px 12px;align-items:center;padding:8px 10px;border-radius:9px;background:rgba(247,222,154,.55)}
.skill b{font-size:15px}.skill small{grid-column:1/-1;opacity:.8;font-size:12.5px}
.quest{padding:8px 10px;border-radius:9px;background:rgba(247,222,154,.55)}
.quest.done{opacity:.6;background:rgba(127,220,139,.4)}
.quest b{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.quest small{display:block;font-size:12.5px;opacity:.85;margin:2px 0 5px}
.grid-inv{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.grid-inv .slot{width:auto;height:auto;aspect-ratio:1;background:var(--paper-2)}
.grid-inv .slot.pick{border-color:var(--red);background:#fff}
.sect{font-family:var(--f-display);font-size:15px;margin:12px 0 4px;color:var(--berry)}
.npc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

#touch{position:fixed;inset:auto 0 calc(var(--gb) + var(--slot) + 34px) 0;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;padding-left:var(--gl);padding-right:calc(var(--gr) + 40px);pointer-events:none}
#joy{width:120px;height:120px;border-radius:50%;background:rgba(255,243,207,.35);border:2px solid rgba(36,26,46,.6);position:relative;pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.tbtns{display:grid;grid-template-columns:auto auto;gap:10px;pointer-events:auto}
.tbtn{width:64px;height:64px;border-radius:50%;font-size:15px;touch-action:none}

#fade{position:fixed;inset:0;z-index:8;background:#12142a;opacity:0;pointer-events:none;transition:opacity .65s}
#fade.on{opacity:1}
#title{position:fixed;inset:0;z-index:7;display:grid;align-content:end;justify-items:center;padding:0 var(--gr) calc(var(--gb) + 5vh) var(--gl);background:linear-gradient(180deg,rgba(20,24,58,0) 30%,rgba(20,24,58,.7));text-align:center}
#title .eyebrow{margin:0;font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper);text-shadow:1px 1px 0 var(--ink)}
#title h1{margin:2px 0 6px;font-family:var(--f-display);font-weight:400;font-size:clamp(64px,15vw,150px);line-height:.95;color:#fff;letter-spacing:.01em;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;filter:drop-shadow(5px 6px 0 var(--ink))}
#title h1 span{background:var(--stripe);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px var(--ink);display:inline-block}
.stripe-bar{width:min(360px,70vw);height:12px;border-radius:6px;border:2px solid var(--ink);background:var(--stripe);margin:2px 0 16px;box-shadow:3px 3px 0 var(--ink)}
.title-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.title-actions .btn{font-size:19px;padding:12px 20px 10px}
#title .hint{margin:16px 0 0;font-size:14px;color:var(--paper);text-shadow:1px 1px 0 var(--ink);max-width:60ch;line-height:1.5}
#title .hint kbd{color:var(--ink);text-shadow:none}

@media (max-width:640px){
  #energy{bottom:calc(var(--gb) + var(--slot) + 30px);height:110px}
  #clock{min-width:0;padding:10px 10px 8px}
  .cl-time{font-size:24px}
  #fishing{left:auto;right:var(--gr)}
  #fish-c{width:90px;height:270px}
  .row{grid-template-columns:34px minmax(0,1fr) auto}
  .row img{width:34px;height:34px}
  .row .acts{grid-column:2 / -1;justify-content:flex-end}
  #tracker{display:none!important}
  #zone{top:calc(var(--gt) + 52px);font-size:22px}
  .grid-inv{grid-template-columns:repeat(6,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){ .toast,.bubble.bang,.floater{animation:none} }
</style>

</head>
<body>
<canvas id="c" tabindex="0" aria-label="Irie Bay, scène de jeu"></canvas>

<div id="hud" hidden>
  <div id="top-left">
    <button id="help-btn" class="chip panel" aria-label="Commandes">?</button>
    <button id="book-btn" class="chip panel" aria-label="Carnet : quêtes, compétences, amis">Carnet</button>
    <button id="bag-btn" class="chip panel" aria-label="Sac à dos">Sac</button>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="zone"></div>
  <div id="clock" class="panel">
    <div class="cl-top"><svg id="cl-wx" viewBox="0 0 32 32" aria-hidden="true"></svg><span id="cl-wd">Lun.</span><span id="cl-d">1</span></div>
    <div id="cl-season">Brise</div>
    <div class="cl-time"><span id="cl-sun"></span><span id="cl-t">6h00</span></div>
    <div class="cl-gold"><span class="coin"></span><span id="cl-g">0</span></div>
  </div>
  <div id="energy" class="panel plain" title="Énergie"><b>É</b><div id="en-fill"></div></div>
  <div id="tracker" class="panel"></div>
  <div id="itemname"></div>
  <div id="prompt" class="panel"></div>
  <div id="hotbar" class="panel" role="toolbar" aria-label="Barre d'objets"></div>
</div>
<div id="bubbles"></div>
<div id="fishing" class="panel" hidden><canvas id="fish-c"></canvas><p>Maintiens <kbd>Espace</kbd></p></div>
<div id="modal-wrap" hidden><div id="modal" class="panel" role="dialog" aria-modal="true"></div></div>
<div id="touch" hidden>
  <div id="joy"><i></i></div>
  <div class="tbtns">
    <button class="tbtn btn" id="t-eat">Manger</button>
    <button class="tbtn btn primary" id="t-use">Outil</button>
    <span></span>
    <button class="tbtn btn" id="t-act">Action</button>
  </div>
</div>
<div id="fade"></div>
<div id="title">
  <p class="eyebrow">Ferme, vagues et bonnes ondes</p>
  <h1>Irie <span>Bay</span></h1>
  <div class="stripe-bar"></div>
  <div class="title-actions">
    <button id="btn-continue" class="btn" hidden>Continuer</button>
    <button id="btn-new" class="btn primary">Nouvelle partie</button>
  </div>
  <p class="hint"><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> ou flèches pour marcher · <kbd>Espace</kbd> ou clic pour utiliser l'outil · <kbd>E</kbd> pour parler, acheter, dormir · <kbd>C</kbd> carnet · <kbd>B</kbd> sac</p>
</div>

<script type="module">
// ==== 01-core.js
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wait = ms => new Promise(r => setTimeout(r, ms));
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
function hash2(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
let seedV = 20261027;
const rnd = () => ((seedV = (seedV * 16807) % 2147483647) - 1) / 2147483646;
const rr = (a, b) => a + rnd() * (b - a);
const pick = arr => arr[(rnd() * arr.length) | 0];
const dayRand = (d, k) => hash2(d * 12.9898 + k * 78.233, k * 3.1 + d * 0.7);

try { await Promise.race([document.fonts.load('48px "Lilita One"'), wait(1500)]); } catch (e) {}

// =====================================================================
// Données de jeu
// =====================================================================
const MIN_SEC = 0.6;              // 1 minute de jeu = 0,6 s
const MAX_EN = 100, INV_SIZE = 30;
const SEASONS = ['Brise', 'Soleil', 'Pluies', 'Alizés'];
const SEASON_DESC = ['Fleurs partout, la terre est douce.', 'Chaleur et grand ciel bleu.', 'Averses, orages et cultures qui boivent.', 'Vent frais et mer agitée.'];
const WEEK = ['Lun.', 'Mar.', 'Mer.', 'Jeu.', 'Ven.', 'Sam.', 'Dim.'];
const WX_NAMES = { sun: 'Grand soleil', cloud: 'Nuageux', rain: 'Pluie', storm: 'Orage' };
const WX_PROBS = [[0.62, 0.2, 0.16, 0.02], [0.76, 0.14, 0.08, 0.02], [0.24, 0.2, 0.4, 0.16], [0.5, 0.3, 0.15, 0.05]];
const seasonOf = day => Math.floor((day - 1) / 28) % 4;
const dom = day => (day - 1) % 28 + 1;
function weatherFor(day) {
  if (day <= 2) return 'sun';
  const p = WX_PROBS[seasonOf(day)], r = dayRand(day, 3.7);
  let a = 0; const keys = ['sun', 'cloud', 'rain', 'storm'];
  for (let k = 0; k < 4; k++) { a += p[k]; if (r < a) return keys[k]; }
  return 'sun';
}
const wet = w => w === 'rain' || w === 'storm';
const rainbowFor = day => weatherFor(day) === 'sun' && day > 1 && wet(weatherFor(day - 1));

const TOOL_NAMES = {
  hoe: ['Houe', 'Houe en fer', 'Houe dorée'],
  can: ['Arrosoir', 'Arrosoir en fer', 'Arrosoir doré'],
  rod: ['Canne en bambou', 'Canne en fibre', 'Canne dorée'],
};
const TOOL_HINT = {

const iconCache = {};
function icon(id, tier = 0) {
  const key = id + ':' + tier;
  if (iconCache[key]) return iconCache[key];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const INK = '#241a2e';
  x.lineJoin = 'round'; x.lineCap = 'round'; x.lineWidth = 3.5; x.strokeStyle = INK;
  const fs = f => { x.fillStyle = f; x.fill(); x.stroke(); };
  const stick = (x1, y1, x2, y2, w, col) => {
    x.save(); x.strokeStyle = INK; x.lineWidth = w + 5; x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke();
    x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke(); x.restore();
  };
  const ell = (cx, cy, rx, ry, col, rot = 0) => { x.beginPath(); x.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); fs(col); };
  const shine = (cx, cy, r) => { x.save(); x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.ellipse(cx, cy, r, r * 0.6, -0.6, 0, Math.PI * 2); x.fill(); x.restore(); };
  const leaves = (cx, cy, col = '#2fa84f') => { ell(cx - 7, cy, 5, 10, col, -0.5); ell(cx + 7, cy, 5, 10, col, 0.5); ell(cx, cy - 4, 5, 10, '#4dc760'); };
  const dots = (pts, col, r = 1.6) => { x.save(); x.fillStyle = col; for (const [a, b] of pts) { x.beginPath(); x.arc(a, b, r, 0, 7); x.fill(); } x.restore(); };
  const it = ITEMS[id];
  const metal = ['#aeb8c6', '#dfe6ee', '#f6c026'][tier];
  const wood = ['#b07a48', '#8f9aa8', '#d9a21b'][tier];
  if (id === 'hoe') {
    stick(16, 54, 44, 16, 5, wood);
    x.beginPath(); x.moveTo(36, 9); x.lineTo(56, 13); x.lineTo(52, 27); x.lineTo(41, 19); x.closePath(); fs(metal);
  } else if (id === 'can') {

function buildWater() {
  // Masque : distance au rivage (écume et bandes de couleur), rivière vs mer
  const dist = new Float32Array(W * H).fill(99), q = [];
  for (let k = 0; k < W * H; k++) if (!isWater(tiles[k])) { dist[k] = 0; q.push(k); }
  for (let h = 0; h < q.length; h++) {
    const k = q[h], i = k % W, j = (k / W) | 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      const ni = i + di, nj = j + dj; if (!inMap(ni, nj)) continue;
      const nk = id(ni, nj), nd = dist[k] + (di && dj ? 1.41 : 1);
      if (nd < dist[nk]) { dist[nk] = nd; q.push(nk); }
    }
  }

  for (let k = 0; k < W * H; k++) {
    data[k * 4] = isWater(tiles[k]) ? 255 : 0;

    data[k * 4 + 2] = tiles[k] === RIVER ? 255 : 0; data[k * 4 + 3] = 255;
  }

  tex.magFilter = tex.minFilter = THREE.LinearFilter; tex.needsUpdate = true;
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uMask: { value: tex }, uRef: { value: null }, uTexMat: { value: new THREE.Matrix4() }, uRefAmt: { value: 1 },
      uTime: { value: 0 }, uSize: { value: new THREE.Vector2(W, H) }, uTint: { value: new THREE.Color('#ffffff') }, uCam: { value: new THREE.Vector3() },
      uGlintDir: { value: new THREE.Vector3(0.3, 0.8, -0.6) }, uGlintCol: { value: new THREE.Color('#fff4c8') }, uGlintAmt: { value: 1 },
      uFogCol: { value: new THREE.Color('#bfe8f2') }, uFogN: { value: 30 }, uFogF: { value: 95 },
      cS: { value: new THREE.Color('#7ff0d8') }, cM: { value: new THREE.Color('#1fc3d6') }, cD: { value: new THREE.Color('#1a86cc') }, cF: { value: new THREE.Color('#f4fcff') },
    },

    fragmentShader: `

        float d = m.g * 8.0;
        if (uv.y > 1.0) d = 8.0;
        float river = m.b;
        float wob = n2(vW.xz * 0.6 + uTime * 0.15) * 0.6;
        float dd = d + wob - 0.3;
        vec3 col = cS;
        if (dd > 1.7 - river * 0.6) col = cM;
        if (dd > 4.0) col = cD;
        vec2 flow = vec2(uTime * 0.22, uTime * 0.1) - vec2(0.0, uTime * 1.3) * river;
        float g = n2(vW.xz * vec2(1.5, 1.5 - river * 1.1) + flow) * 0.6 + n2(vW.xz * 0.7 - flow * 0.6 + 5.0) * 0.4;

        float foam = 1.0 - step(fe, d + wob * 0.35);

  scene.add(waterMesh);
}

}

const rainTmp = new THREE.Vector3();
function updateNature(dt, tsec, focus, sdir) {
  // papillons : seulement par beau temps et en journée
  const bf = (1 - ENV.night) * (1 - ENV.rain) > 0.5 ? 1 : 0, season = seasonOf(S.day);
  const nBut = Math.round(bf * (season === 0 ? 40 : season === 1 ? 28 : season === 3 ? 12 : 8));
  butterflies.forEach((b, k) => {
    if (k >= nBut) { butB.hide(k); return; }
    b.a += (Math.sin(tsec * 0.7 + b.ph) * 1.8) * dt; b.x += Math.cos(b.a) * b.s * dt; b.z += Math.sin(b.a) * b.s * dt;
    if (Math.hypot(b.x - focus.x, b.z - focus.z) > 22) { b.x = focus.x + (rnd() - 0.5) * 30; b.z = focus.z + (rnd() - 0.5) * 24; }
    const flap = 0.25 + Math.abs(Math.cos(tsec * 16 + b.ph)) * 0.75;
    butB.set(k, b.x, b.y + Math.sin(tsec * 2 + b.ph) * 0.2, b.z, flap, 1, 1, -b.a + Math.PI / 2, 0.15);
  });
  butB.instanceMatrix.needsUpdate = true;
  // lucioles : la nuit, loin de la pluie
  const nf = clamp((ENV.night - 0.35) * 2.2, 0, 1) * (1 - ENV.rain);
  fireB.material.opacity = nf;
  fireflies.forEach((f, k) => {
    if (nf <= 0.01) { if (f.on) { fireB.hide(k); f.on = false; } return; }
    f.on = true; f.a += Math.sin(tsec * 0.9 + f.ph) * 1.4 * dt; f.x += Math.cos(f.a) * 0.5 * dt; f.z += Math.sin(f.a) * 0.5 * dt;
    if (Math.hypot(f.x - focus.x, f.z - focus.z) > 18 || (f.x === 0 && f.z === 0)) { f.x = focus.x + (rnd() - 0.5) * 32; f.z = focus.z + (rnd() - 0.5) * 26; }
    const pulse = 0.35 + 0.65 * Math.max(0, Math.sin(tsec * 2.4 + f.ph * 3));
    const s = 0.045 + pulse * 0.05;
    fireB.set(k, f.x, f.y + Math.sin(tsec * 1.3 + f.ph) * 0.25, f.z, s, s, s);
  });
  fireB.instanceMatrix.needsUpdate = true;
  // nuages
  const cover = 0.35 + ENV.cloud * 0.65;
  clouds.forEach((c, k) => {
    c.x += c.sp * WIND.uWind.value * dt * 1.4; if (c.x > W + 14) c.x = -14;
    const h = 24 + (k % 4);
    c.g.visible = k / clouds.length < cover;
    c.g.position.set(c.x + sdir.x / sdir.y * h, h, c.z + sdir.z / sdir.y * h);
  });
  // pluie
  const rn = ENV.rain;
  const cnt = Math.round(1000 * Math.min(1, rn * (ENV.storm > 0.5 ? 1 : 0.7)));
  rainB.count = cnt;
  const sp = 24 + ENV.storm * 10;
  for (let k = 0; k < cnt; k++) {
    const d = rainDrops[k]; d.y -= sp * dt; if (d.y < 0) { d.y += 14; d.x = (rnd() - 0.5) * 38; d.z = (rnd() - 0.5) * 34; }
    rainB.set(k, focus.x + d.x, d.y, focus.z + d.z + 3, 0.018, 0.55, 0.018, 0, 0.12);
  }
  rainB.instanceMatrix.needsUpdate = true;
  // arc-en-ciel
  rainbowG.children.forEach(m => m.material.opacity = ENV.rainbow * 0.7);
  rainbowG.visible = ENV.rainbow > 0.01;
  // crabes
  for (const c of crabs) {
    const d = Math.hypot(P.x - c.x, P.z - c.z); c.t -= dt;
    if (d < 2.5) { c.vx = Math.sign(c.x - P.x || 1) * 2.2; c.t = 0.6; }
    else if (c.t <= 0) { c.vx = rnd() < 0.5 ? 0 : (rnd() < 0.5 ? -0.6 : 0.6); c.t = 0.6 + rnd() * 2; }
    const nx = c.x + c.vx * dt; if (!blocked(nx, c.z, 0.1) && tileAt(Math.floor(nx), Math.floor(c.z)) === SAND) c.x = nx; else c.vx = -c.vx;
    c.g.position.set(c.x, 0, c.z); c.g.rotation.y = 0; c.g.children[0].position.y = 0.1 + Math.abs(Math.sin(tsec * 14 + c.t)) * (c.vx ? 0.02 : 0);
    c.g.visible = !wet(S.weather) && ENV.night < 0.6;
  }
}

  if (q.item) { if (!addItem(q.item[0], q.item[1])) msg += ' (sac plein, objet perdu)'; else msg += ` · +${q.item[1]} ${ITEMS[q.item[0]].name}`; }

// ---------- Cultures

    if (ripe) for (let k = 0; k < 4; k++) part(g, G.cone, '#6fbe3f', [0.025, 0.14, 0.025], [Math.cos(k * 1.6) * 0.09, 0.3 + (k % 2) * 0.1, Math.sin(k * 1.6) * 0.09], [Math.sin(k) * 0.3, 0, 0.3]);

    if (ripe) part(g, cropG.ball, '#a24b8a', [0.14, 0.08, 0.1], [0.04, 0.03, 0.02], [0, 0.4, 0]);
  } else if (type === 'tomate') {

    part(g, cropG.ball, L2, [0.18, 0.16, 0.18], [0, 0.2, 0]); part(g, cropG.ball, ripe ? L3 : L2, [0.16, 0.15, 0.16], [0.02, 0.42, 0.02]);

  } else if (type === 'piment') {

    if (ripe) for (const [x, y, z, c] of [[0.14, 0.18, 0.1, '#e2362f'], [-0.12, 0.26, 0.1, '#f08a2a'], [0.05, 0.36, -0.1, '#e2362f'], [-0.1, 0.14, -0.12, '#f6c026']]) part(g, G.cone, c, [0.04, 0.12, 0.04], [x, y, z], [Math.PI, 0, 0.3]);

    if (!ripe) part(g, cropG.ball, '#8cc152', [0.1, 0.08, 0.1], [0.05, 0.08, 0.05]);
    else { part(g, cropG.ball, toon('#e89a2a', { flatShading: true }), [0.3, 0.22, 0.3], [0, 0.2, 0]); part(g, G.cyl6, '#7a5136', [0.03, 0.12, 0.03], [0, 0.45, 0]); }
  } else if (type === 'ananas') {
    for (let k = 0; k < 8; k++) part(g, G.cone, ripe ? L3 : L2, [0.04, 0.3, 0.02], [Math.cos(k * 0.785) * 0.1, 0.14, Math.sin(k * 0.785) * 0.1], [Math.sin(k * 0.785) * 0.6, k * 0.785, -Math.cos(k * 0.785) * 0.6]);
    if (ripe) { part(g, cropG.ball, '#f6c026', [0.13, 0.17, 0.13], [0, 0.2, 0]); for (let k = 0; k < 5; k++) part(g, G.cone, '#2f9a40', [0.03, 0.14, 0.015], [Math.cos(k * 1.26) * 0.04, 0.42, Math.sin(k * 1.26) * 0.04], [Math.sin(k * 1.26) * 0.5, 0, -Math.cos(k * 1.26) * 0.5]); }

function refreshPlot(k) {

// ---------- Actions du joueur
function busy() { return !!(S.modal || S.title || S.fade); }
function targetKey() { const [i, j] = S.target; return inMap(i, j) ? id(i, j) : -1; }
function faceTarget() {
  const [i, j] = S.target, dx = i + 0.5 - P.x, dz = j + 0.5 - P.z;
  if (Math.abs(dx) < 0.3 && Math.abs(dz) < 0.3) return;

  S.card = Math.abs(dx) > Math.abs(dz) ? [Math.sign(dx), 0] : [0, Math.sign(dz)];
}
function anim(type, dur = 0.3) { S.swing = dur; S.swingDur = dur; S.swingType = type; }
function lineTiles(ti, tj, n) { const out = []; for (let q = 0; q < n; q++) out.push([ti + S.card[0] * q, tj + S.card[1] * q]); return out; }
function useItem() {

  const [ti, tj] = S.target, p = plots.get(k);
  if (p && p.crop && cropStage(p.crop) === 3) { faceTarget(); harvest(k); anim('pick', 0.25); return; }

  } else if (slot.id === 'can') {
    if (waterAt(ti, tj)) { S.water = canMax(tier); anim('can', 0.35); sfx('splash'); toast('Arrosoir rempli.'); renderHotbar(); return; }
    const tl = lineTiles(ti, tj, tierLine(tier)).filter(([i, j]) => inMap(i, j) && plots.has(id(i, j)) && !plots.get(id(i, j)).watered);
    if (!plots.has(k)) return;
    if (S.water <= 0) { toast("Arrosoir vide : remplis-le à la rivière ou à la mer."); return; }
    if (!tl.length) return;
    if (!spend(farmCost(1))) return;
    anim('can', 0.35);
    for (const [i, j] of tl) { if (S.water <= 0) break; const pk = id(i, j); plots.get(pk).watered = true; S.water--; refreshPlot(pk); bump('watered'); }
    sfx('water'); renderHotbar();

    if (lvl('farm') < def.lvl) { toast(`Il faut le niveau ${def.lvl} en agriculture.`); return; }
    p.crop = { type: it.crop, age: 0 }; if (wet(S.weather)) p.watered = true; takeFrom(S.sel, 1); refreshPlot(k); anim('seed', 0.25); sfx('plant'); bump('planted');

function nearestInteract() {
  let best = null, bd = 99;
  const take = (d, o) => { if (d < bd) { bd = d; best = o; } };
  for (const it of interactables) { if (it.ok && !it.ok()) continue; const d = Math.hypot(P.x - it.x, P.z - it.z); if (d < it.r) take(d - 0.3, it); }
  for (const n of npcs) {
    if (n.hidden) continue; const d = Math.hypot(P.x - n.x, P.z - n.z);
    const atCounter = n.shop && n.cur === `${n.id}_counter` && !n.path && S.time >= SHOPS[n.shop].open && S.time < SHOPS[n.shop].close;
    if (d < 1.5 && !atCounter) take(d, { label: `Parler à ${n.name}`, act: () => openNPC(n) });
  }
  for (const o of animalMeshes.values()) { if (!o.g.visible) continue; const d = Math.hypot(P.x - o.x, P.z - o.z); if (d < 1.25) take(d - 0.2, { label: `Caresser ${o.a.name}`, act: () => petAnimal(o.a) }); }

}

  if (busy() || S.fish.phase) return;
  const k = targetKey(), p = plots.get(k);
  if (p && p.crop && cropStage(p.crop) === 3) { faceTarget(); harvest(k); anim('pick', 0.25); return; }
  const it = nearestInteract(); if (it) it.act();

// ---------- Élevage
const CAPACITY = { poule: 6, vache: 3 }, ANIMAL_PRICE = { poule: 250, vache: 900 };
let animalSeq = 1;
function animalsOf(type) { return S.animals.filter(a => a.type === type); }
function buyAnimal(type) {

  if (S.gold < ANIMAL_PRICE[type]) return;
  const used = S.animals.map(a => a.name), name = NAMES_ANIMALS.find(n => !used.includes(n)) || pick(NAMES_ANIMALS);
  S.gold -= ANIMAL_PRICE[type]; S.animals.push({ id: 'a' + (animalSeq++) + '_' + S.day, type, name, col: (rnd() * 5) | 0, happy: 50, fed: false, pet: false });
  bump(type === 'poule' ? 'chickens' : 'cows'); syncAnimalMeshes(); sfx('coin');
}

  const list = animalsOf(type).filter(a => !a.fed);
  if (!list.length) { toast('Tout le monde a déjà mangé.'); return; }
  const have = countItem('fourrage'), n = Math.min(have, list.length);
  if (!n) { toast('Il te faut du fourrage (Graines Irie).'); return; }
  takeItem('fourrage', n); for (let k = 0; k < n; k++) { list[k].fed = true; list[k].happy = Math.min(100, list[k].happy + 4); }
  sfx('eat'); toast(`${n} animal${n > 1 ? 'aux nourris' : ' nourri'}.`.replace('animalaux', 'animaux'));
  xpGain('ranch', 2 * n);
}

  if (a.pet) { toast(`${a.name} a déjà eu sa caresse du jour.`); return; }
  a.pet = true; a.happy = Math.min(100, a.happy + 8 + lvl('ranch')); sfx(a.type === 'poule' ? 'cluck' : 'moo'); floater(`${a.name} est content !`); xpGain('ranch', 2); anim('pick', 0.3);
}

  let got = 0;
  for (const k of keys2) { while (S.shed[k] > 0 && addItem(k, 1)) { S.shed[k]--; got++; bump(type === 'poule' ? 'eggs' : 'milk'); xpGain('ranch', 4); } }
  if (got) { sfx('harvest'); toast(`Tu récupères ${got} produit${got > 1 ? 's' : ''}.`); } else toast(S.shed[keys2[0]] + S.shed[keys2[1]] ? 'Ton sac est plein.' : 'Rien à ramasser pour le moment.');

// ---------- Pêche
const fishUI = $('#fishing'), fishC = $('#fish-c'), fctx = fishC.getContext('2d');
let fishImg = new Image(), mg = null, bang = null;
function startCast() {

  if (!tgt) { toast("Vise l'eau pour lancer ta ligne."); return; }
  if (!spend(3)) return;
  const k = id(tgt[0], tgt[1]);
  S.fish = { phase: 'cast', t: 0, to: new THREE.Vector3(tgt[0] + 0.5, -0.24, tgt[1] + 0.5), from: new THREE.Vector3(), type: tiles[k] === RIVER ? 'river' : 'sea', pier: tgt[1] >= 55 };
  tools.rodTip(S.fish.from); bobber.visible = true; fishLine.visible = true; anim('cast', 0.45); sfx('cast');
}
function endFishing(msg) {
  S.fish = { phase: null }; bobber.visible = false; fishLine.visible = false; fishUI.hidden = true; bang.hidden = true; mg = null;
  if (msg) toast(msg);
}
function pickFish(f) {
  const night = isNight(), rareBoost = (lvl('fish') >= 5 ? 0.4 : 0) + (toolTier('rod') >= 2 ? 0.4 : 0) + 1;
  const list = FISH_TABLE[f.type].filter(e => !e[2] || (e[2] === 'night' && night) || (e[2] === 'pier' && f.pier));
  const w = e => e[1] * (e[1] < 20 ? rareBoost * (f.pier ? 1.6 : 1) : 1);
  let tot = 0; for (const e of list) tot += w(e);
  let r = rnd() * tot;
  for (const e of list) { r -= w(e); if (r <= 0) return e[0]; }

}

  const fid = pickFish(S.fish), def = ITEMS[fid];
  S.fish.phase = 'game'; bang.hidden = true;
  const TR = 300, barH = 70 + 7 * (lvl('fish') - 1) + [0, 22, 40][toolTier('rod')];
  mg = { fid, d: def.diff, TR, barH, barY: TR - barH, barV: 0, fy: TR * 0.7, ft: TR * 0.5, ftT: 0, prog: 0.3 + (lvl('fish') >= 3 ? 0.08 : 0) };

  fishUI.hidden = false; sfx('bite');
}
function updateMinigame(dt) {
  const m = mg; if (!m) return;

  m.fy += (m.ft - m.fy) * Math.min(1, dt * (1.4 + m.d / 20)) + Math.sin(performance.now() / 90) * m.d / 160;
  m.fy = clamp(m.fy, 8, m.TR - 8);
  const inside = m.fy > m.barY && m.fy < m.barY + m.barH;
  m.prog += (inside ? 0.27 : -0.2 * (0.6 + m.d / 110)) * dt;
  if (m.prog >= 1) {
    const def = ITEMS[m.fid], cm = Math.round(lerp(def.cm[0], def.cm[1], rnd()));
    if (addItem(m.fid, 1)) {
      sfx('catch'); floater(`${def.name} · ${cm} cm`, m.fid); toast(`Tu as pêché : ${def.name} (${cm} cm) !`);
      const L = S.fishLog[m.fid] || (S.fishLog[m.fid] = { n: 0, max: 0 }); L.n++; L.max = Math.max(L.max, cm);

  if (fishC.width !== Math.round(cw * dpr)) { fishC.width = Math.round(cw * dpr); fishC.height = Math.round(ch * dpr); }

  const tw = cw * 0.52, tx = 6, ty = 10, th = m.TR * sc;
  x.lineWidth = 2.5; x.strokeStyle = '#241a2e';
  x.fillStyle = '#35bfd8'; x.beginPath(); x.roundRect(tx, ty, tw, th, 10); x.fill();
  x.fillStyle = '#1f8fc0'; x.beginPath(); x.roundRect(tx, ty + th * 0.72, tw, th * 0.28, [0, 0, 10, 10]); x.fill();
  x.beginPath(); x.roundRect(tx, ty, tw, th, 10); x.stroke();
  x.fillStyle = inside ? 'rgba(111,230,95,.9)' : 'rgba(111,230,95,.55)';
  x.beginPath(); x.roundRect(tx + 3, ty + m.barY * sc, tw - 6, m.barH * sc, 7); x.fill(); x.stroke();
  const fs = tw * 0.95; if (fishImg.complete && fishImg.naturalWidth) x.drawImage(fishImg, tx + tw / 2 - fs / 2, ty + m.fy * sc - fs / 2, fs, fs);
  const px = tx + tw + 8, pw = cw - px - 6;
  x.fillStyle = '#241a2e'; x.beginPath(); x.roundRect(px, ty, pw, th, 6); x.fill();
  x.fillStyle = m.prog < 0.3 ? '#e2362f' : m.prog < 0.7 ? '#f6c026' : '#2fa84f';

}
function updateFishing(dt) {
  const f = S.fish; if (!f.phase) return;
  const tp = performance.now() / 1000;
  if (f.phase === 'cast') {
    f.t += dt; const u = Math.min(1, f.t / 0.45);
    bobber.position.lerpVectors(f.from, f.to, u); bobber.position.y += Math.sin(u * Math.PI) * 1.6;
    if (u >= 1) { f.phase = 'wait'; f.wait = (1.5 + rnd() * 5) * (wet(S.weather) ? 0.7 : 1) * (lvl('fish') >= 3 ? 0.8 : 1) * [1, 0.85, 0.7][toolTier('rod')]; sfx('splash'); }
  } else if (f.phase === 'wait') {
    bobber.position.copy(f.to); bobber.position.y += Math.sin(tp * 3) * 0.02;
    f.wait -= dt; if (f.wait <= 0) { f.phase = 'bite'; f.bite = 0.95; bang.hidden = false; sfx('bite'); }
  } else if (f.phase === 'bite') {
    bobber.position.copy(f.to); bobber.position.y += -0.08 + Math.sin(tp * 30) * 0.03;
    f.bite -= dt; if (f.bite <= 0) { sfx('lose'); endFishing('Trop tard, il a filé.'); }
  } else if (f.phase === 'game') {
    bobber.position.copy(f.to); bobber.position.x += Math.sin(tp * 7) * 0.12; bobber.position.y -= 0.06;
    updateMinigame(dt);
  }
  if (S.fish.phase) {
    const a = new THREE.Vector3(); tools.rodTip(a); const b = bobber.position; const arr = fishLine.geometry.attributes.position;
    for (let k = 0; k <= 12; k++) { const u = k / 12; arr.setXYZ(k, lerp(a.x, b.x, u), lerp(a.y, b.y + 0.06, u) - Math.sin(u * Math.PI) * 0.35, lerp(a.z, b.z, u)); }
    arr.needsUpdate = true;
  }
}

async function sleepNow(passedOut) {
  if (S.fade) return;
  closeModal(); endFishing();
  S.fade = true; $('#fade').classList.add('on'); await wait(750);
  const res = { grown: 0, earned: 0, dead: 0, eggs: 0, milk: 0, lost: 0, passedOut, ups: S.pending.splice(0), season: null, shipped: S.ship.slice() };
  for (const [k, p] of plots) { if (p.crop && p.watered && p.crop.age < CROPS[p.crop.type].days) { p.crop.age++; res.grown++; } p.watered = false; }
  for (const a of S.animals) {
    if (a.fed) {
      const prem = (a.happy >= 80 ? 0.3 : 0.06) + (lvl('ranch') >= 3 ? 0.1 : 0);
      if (a.type === 'poule') { S.shed[rnd() < prem ? 'oeuf_or' : 'oeuf']++; res.eggs++; } else { S.shed[rnd() < prem ? 'lait_creme' : 'lait']++; res.milk++; }
    } else a.happy = Math.max(0, a.happy - 12);
    if (a.fed && !a.pet) a.happy = Math.max(0, a.happy - 2);
    a.fed = false; a.pet = false;
  }
  for (const [it, q] of S.ship) res.earned += ITEMS[it].sell * q; S.ship = []; addGold(res.earned, true);
  if (passedOut) { res.lost = Math.min(500, Math.floor(S.gold * 0.1)); S.gold -= res.lost; }
  const oldSeason = seasonOf(S.day); S.day++; const ns = seasonOf(S.day);
  if (ns !== oldSeason) {
    res.season = ns;
    for (const [k, p] of plots) if (p.crop && !CROPS[p.crop.type].seasons.includes(ns)) { p.crop = null; res.dead++; }
  }
  S.weather = weatherFor(S.day);
  if (wet(S.weather)) for (const p of plots.values()) p.watered = true;
  S.time = 360; S.warned = false; S.energy = passedOut ? Math.round(MAX_EN * 0.6) : MAX_EN; S.picked = { coco: [], shells: [] };
  P.x = 9.7; P.z = 7.2; P.face = Math.PI / 2; S.card = [1, 0];
  for (const k of plots.keys()) refreshPlot(k);
  refreshForage(); placeAllNPCs(); checkQuests(); save();
  S.fade = false; $('#fade').classList.remove('on');
  openDayCard(res);
}

    if (S.gold < price) return;

    S.gold -= price; sfx('coin'); renderHotbar(); renderModal(); renderTracker(); return;
  }
  if (d.buyc) {
    const c = COSM[d.buyc], price = priceBuy(MODAL.key, c.price); if (S.gold < price) return;
    S.gold -= price; S.owned.push(d.buyc); bump('bought_cosm'); sfx('coin'); toast(`${c.name} ajouté à ta garde-robe.`, true); renderModal(); return;
  }
  if (d.wear) { const c = COSM[d.wear]; S.eq[c.slot] = d.wear; buildPlayer(); sfx('sel'); renderModal(); return; }
  if (d.upg) {
    const t = toolTier(d.upg), nxt = t + 1, cost = Math.round(UPGRADE_COST[nxt] * (shopBonus(MODAL.key) ? 0.9 : 1)); if (S.gold < cost) return;
    const slot = S.inv.find(s => s && s.id === d.upg); S.gold -= cost; slot.t = nxt; bump('upgrades');
    if (d.upg === 'can') S.water = canMax(nxt);
    buildPlayer(); sfx('level'); toast(`${TOOL_NAMES[d.upg][nxt]} : ${TOOL_HINT[d.upg][nxt]}.`, true); renderHotbar(); renderModal(); return;
  }
  if (d.sell || d.sellall) {
    const k = +(d.sell || d.sellall), s = S.inv[k]; if (!s) return;
    const n = d.sellall ? s.q : 1, gain = priceSell(MODAL.key, s.id) * n; addGold(gain, true); takeFrom(k, n); sfx('coin'); renderModal(); return;
  }
  if (d.ship || d.shipall) {
    const k = +(d.ship || d.shipall), s = S.inv[k]; if (!s) return;
    const n = d.shipall ? s.q : 1, ex = S.ship.find(e2 => e2[0] === s.id);
    if (ex) ex[1] += n; else S.ship.push([s.id, n]);
    takeFrom(k, n); sfx('plant'); renderModal(); return;
  }
  if (d.gift) {
    const n = NPC_BY_ID[MODAL.kind === 'npc' ? MODAL.npc : SHOPS[MODAL.key].npc];

  }
  if (d.deliver) {
    const q = QUESTS.find(x => x.id === d.deliver), [nid, it, cnt] = q.deliver;
    if (countItem(it) >= cnt) { takeItem(it, cnt); completeQuest(q); MODAL.msg = ''; renderModal(); }

  if ('collect' in d) { collectShed(MODAL.type); renderModal(); return; }

// =====================================================================
// Son : reggae synthétisé (one-drop, skank, basse chaude), ambiance, bruitages
// =====================================================================
let AC = null, muted = false, noiseBuf = null;

function audio() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); initAudioGraph(); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function mkNoise() {
  const b = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b;
}
function loopNoise(type, freq, q = 0.7) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.value = 0; s.connect(f).connect(g).connect(AU.master); s.start();
  return { s, f, g };
}
function initAudioGraph() {
  noiseBuf = mkNoise();
  AU.master = AC.createGain(); AU.master.gain.value = muted ? 0 : 0.9; AU.master.connect(AC.destination);
  AU.sfx = AC.createGain(); AU.sfx.gain.value = 1; AU.sfx.connect(AU.master);
  AU.music = AC.createGain(); AU.music.gain.value = 0.3;
  AU.lp = AC.createBiquadFilter(); AU.lp.type = 'lowpass'; AU.lp.frequency.value = 3200; AU.lp.Q.value = 0.4;
  AU.music.connect(AU.lp); AU.lp.connect(AU.master);
  // réverbération courte pour le côté dub
  const conv = AC.createConvolver(), len = AC.sampleRate * 1.5, imp = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const d = imp.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  conv.buffer = imp; AU.rev = AC.createGain(); AU.rev.gain.value = 0.28; AU.rev.connect(conv); conv.connect(AU.lp);
  AU.amb.ocean = loopNoise('lowpass', 650); AU.amb.river = loopNoise('bandpass', 900, 0.9); AU.amb.rain = loopNoise('highpass', 1400, 0.5); AU.amb.wind = loopNoise('lowpass', 420);
  // houle : modulation lente du volume de l'océan
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.11; lg.gain.value = 0.35; lfo.connect(lg); lg.connect(AU.amb.ocean.f.frequency); lfo.start();
  AU.on = true; AU.next = AC.currentTime + 0.2; AU.step = 0; AU.bar = 0;
  AU.timer = setInterval(musicTick, 25);
}
function setMuted(m) { muted = m; try { localStorage.setItem('ib-mute', m ? '1' : '0'); } catch (e) {} if (AU.master) AU.master.gain.setTargetAtTime(m ? 0 : 0.9, AC.currentTime, 0.05); }

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = [
  { root: 48, third: 4, notes: [55, 60, 64, 67] },   // Cmaj7
  { root: 45, third: 3, notes: [57, 60, 64, 69] },   // Am7
  { root: 41, third: 4, notes: [57, 60, 65, 69] },   // Fmaj7
  { root: 43, third: 4, notes: [55, 59, 62, 67] },   // G6
];
const PENTA = [72, 74, 76, 79, 81, 84];
function env(g, t, a, d, v) { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function voice(type, freq, t, a, d, v, dest, pan = 0, filt = 0) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = freq;
  let node = o; if (filt) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filt; o.connect(f); node = f; }
  node.connect(g); env(g, t, a, d, v);
  let out = g; if (pan && AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
  out.connect(dest); if (dest === AU.music) { const s = AC.createGain(); s.gain.value = 0.5; out.connect(s); s.connect(AU.rev); }
  o.start(t); o.stop(t + a + d + 0.05);
}
function drumNoise(t, dur, freq, v, type = 'bandpass', q = 1, send = false) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf; const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); s.connect(f); f.connect(g); env(g, t, 0.002, dur, v); g.connect(AU.music);
  if (send) { const sg = AC.createGain(); sg.gain.value = 0.9; g.connect(sg); sg.connect(AU.rev); }
  s.start(t, Math.random()); s.stop(t + dur + 0.03);
}
function playStep(step, t) {
  const bar = AU.bar % 4, ch = CHORDS[bar], day = ENV.night < 0.6, sd = 60 / AU.tempo / 4;
  const rainy = ENV.rain > 0.3;
