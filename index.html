<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes petits jeux</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎮 Mes petits jeux</h1>
    <p>Clique sur un jeu pour y jouer.</p>
  </header>
  <main id="grille" class="grille"></main>
  <footer>V1</footer>
  <script src="jeux.js"></script>
  <script>
    const grille = document.getElementById("grille");
    for (const jeu of JEUX) {
      const carte = document.createElement("a");
      carte.className = "carte";
      carte.href = "jeux/" + jeu.dossier + "/";
      carte.innerHTML = `<span class="emoji">${jeu.emoji || "🕹️"}</span>
        <h2>${jeu.titre}</h2><p>${jeu.description || ""}</p>`;
      grille.appendChild(carte);
    }
  </script>
</body>
</html>
